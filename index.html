<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Julguem</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: Arial, sans-serif;
        }

        .game {
            text-align: center;
        }

        .counter {
            font-size: 30px;
            color: #e76f83;
            margin-bottom: 30px;
        }

        .character {
            font-size: 120px;
            cursor: pointer;
            user-select: none;
            position: relative;
            display: inline-block;
            transition: transform 0.15s;
        }

        .character:active {
            transform: scale(0.9);
        }

        .heart {
            position: absolute;
            pointer-events: none;
            font-size: 25px;
            animation: fly 1s ease-out forwards;
        }

        @keyframes fly {
            0% {
                opacity: 1;
                transform: translate(0, 0) scale(0.5);
            }

            100% {
                opacity: 0;
                transform: translate(var(--x), var(--y)) scale(1.5);
            }
        }
        .character img {
    width: 400px;
    height: 400px;
    object-fit: contain;
    cursor: pointer;
    user-select: none;
    -webkit-user-drag: none;
}
.word {
    position: absolute;
    pointer-events: none;
    font-size: 20px;
    font-weight: bold;
    color: #e76f83;
    white-space: nowrap;
    animation: wordFly 1.2s ease-out forwards;
}

@keyframes wordFly {
    0% {
        opacity: 1;
        transform: translate(0, 0) rotate(-10deg) scale(0.5);
    }

    100% {
        opacity: 0;
        transform: translate(var(--x), var(--y)) rotate(10deg) scale(1.3);
    }
}
    </style>
</head>

<body>

    <div class="game">
        <div class="counter">
            <span id="score">0</span> ♡
        </div>

        <div class="character" id="character">
    <img src="file:///C:/Users/kante/OneDrive/Desktop/ussues/5445099520455811282_121.jpg" alt="character">
</div>
    </div>
<script>
    let score = 0;

    const character = document.getElementById("character");
    const counter = document.getElementById("score");

    const words = ["Smooch!", "Kiss!", "Mwah!", "♡", "Love!"];

    character.addEventListener("click", function(event) {

        score++;
        counter.textContent = score;

        // Сердечки
        for (let i = 0; i < 5; i++) {
            const heart = document.createElement("span");

            heart.classList.add("heart");
            heart.textContent = "♥";

            heart.style.color = ["#ff6b81", "#ff9eb5", "#e85d75"][
                Math.floor(Math.random() * 3)
            ];

            heart.style.left = "50%";
            heart.style.top = "50%";

            heart.style.setProperty("--x", (Math.random() * 200 - 100) + "px");
            heart.style.setProperty("--y", (-Math.random() * 150 - 30) + "px");

            character.appendChild(heart);

            setTimeout(() => heart.remove(), 1000);
        }

        // Слова
        const word = document.createElement("span");

        word.classList.add("word");
        word.textContent = words[Math.floor(Math.random() * words.length)];

        word.style.left = "50%";
        word.style.top = "20%";

        word.style.setProperty("--x", (Math.random() * 160 - 80) + "px");
        word.style.setProperty("--y", (-Math.random() * 120 - 40) + "px");

        character.appendChild(word);

        setTimeout(() => word.remove(), 1200);

    });
</script>
</body>
</html>
